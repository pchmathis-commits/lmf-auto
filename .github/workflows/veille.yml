name: Veille hebdo

on:
  workflow_dispatch:

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      SHEET_URL: ${{ secrets.SHEET_URL }}
      SHEET_SECRET: ${{ secrets.SHEET_SECRET }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m lmf.veille
      - name: Sauvegarder le rapport
        if: always()
        run: |
          git config user.name "lmf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/veille data/prospection.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "Rapport hebdo"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done

      - name: Relevé vers La Carte
        if: always()
        continue-on-error: true
        env:
          PASSERELLE: ${{ secrets.LMF_PASSERELLE }}
          STATUT: ${{ job.status == 'success' && 'ok' || 'erreur' }}
        run: |
          [ -z "$PASSERELLE" ] && exit 0
          ARGS=(--data-urlencode "statut=$STATUT")
          [ "$STATUT" = "erreur" ] && ARGS+=(--data-urlencode "message=La tâche « ${{ github.workflow }} » a échoué (détail dans GitHub Actions)")
          if [ "$STATUT" = "ok" ]; then
            F=$(ls -1 data/veille/*.json 2>/dev/null | tail -1)
            if [ -n "$F" ]; then
              A=$(python3 -c "import json,sys;m=json.load(open(sys.argv[1])).get('moi',{});print(m.get('abonnes') or '')" "$F" 2>/dev/null)
              N=$(python3 -c "import json,sys;m=json.load(open(sys.argv[1])).get('moi',{});print(len(m['posts']) if m.get('posts') is not None else '')" "$F" 2>/dev/null)
              D=$(python3 -c "import json,sys;m=json.load(open(sys.argv[1])).get('moi',{});p=sorted(m.get('posts',[]),key=lambda x:x.get('date',''));print(p[-1]['legende'][:120] if p else '')" "$F" 2>/dev/null)
              [ -n "$A" ] && ARGS+=(--data-urlencode "abonnes=$A")
              [ -n "$N" ] && ARGS+=(--data-urlencode "publications7=$N")
              [ -n "$D" ] && ARGS+=(--data-urlencode "derniere=$D")
            fi
          fi
          curl -sSL -G --max-time 30 "$PASSERELLE" "${ARGS[@]}" || true
