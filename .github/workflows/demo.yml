name: Carrousel de démonstration

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m lmf.main demo
      - uses: actions/upload-artifact@v4
        with:
          name: carrousel-demo
          path: out/posts/

      - name: Relevé vers La Carte
        if: always()
        continue-on-error: true
        env:
          PASSERELLE: ${{ secrets.LMF_PASSERELLE }}
          STATUT: ${{ job.status == 'success' && 'ok' || 'erreur' }}
        run: |
          [ -z "$PASSERELLE" ] && exit 0
          ARGS=(--data-urlencode "statut=$STATUT")
          [ "$STATUT" = "erreur" ] && ARGS+=(--data-urlencode "message=La tâche « ${{ github.workflow }} » a échoué (détail dans GitHub Actions)")
          curl -sSL -G --max-time 30 "$PASSERELLE" "${ARGS[@]}" || true
