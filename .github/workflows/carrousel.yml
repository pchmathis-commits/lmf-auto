name: Carrousel

on:
  workflow_dispatch:

concurrency:
  group: lmf-creation
  cancel-in-progress: false

jobs:
  creer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      SHEET_URL: ${{ secrets.SHEET_URL }}
      SHEET_SECRET: ${{ secrets.SHEET_SECRET }}
      IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: assets/Montserrat.ttf
          key: montserrat-v1
      - run: pip install -r requirements.txt
      - name: Créer le post
        run: python -m lmf.main carrousel

      - name: Relevé vers La Carte
        if: always()
        continue-on-error: true
        env:
          PASSERELLE: ${{ secrets.LMF_PASSERELLE }}
          STATUT: ${{ job.status == 'success' && 'ok' || 'erreur' }}
        run: |
          [ -z "$PASSERELLE" ] && exit 0
          ARGS=(--data-urlencode "statut=$STATUT")
          [ "$STATUT" = "erreur" ] && ARGS+=(--data-urlencode "message=La tâche « ${{ github.workflow }} » a échoué (détail dans GitHub Actions)")
          if [ "$STATUT" = "ok" ] && [ -f out/post.json ]; then
            P=$(python3 -c "import json,datetime as d;p=json.load(open('out/post.json'));print(d.datetime.fromisoformat(p['publication_prevue']).strftime('%d/%m %H:%M')+' : '+p['titre'][:120])" 2>/dev/null)
            [ -n "$P" ] && ARGS+=(--data-urlencode "prochaine=$P")
          fi
          curl -sSL -G --max-time 30 "$PASSERELLE" "${ARGS[@]}" || true
