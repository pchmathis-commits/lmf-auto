name: Préparer demain

on:
  workflow_dispatch:

concurrency:
  group: lmf-creation
  cancel-in-progress: false

jobs:
  preparer:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      SHEET_URL: ${{ secrets.SHEET_URL }}
      SHEET_SECRET: ${{ secrets.SHEET_SECRET }}
      IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: assets/Montserrat.ttf
          key: montserrat-v1
      - run: pip install -r requirements.txt dnspython
      - name: Préparer les posts et les prospects de demain
        run: python -m lmf.main preparer
      - name: Sauvegarder le suivi de la prospection
        if: always()
        run: |
          git config user.name "lmf-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prospection.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "Préparation de demain"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done

      - name: Relevé vers La Carte
        if: always()
        continue-on-error: true
        env:
          PASSERELLE: ${{ secrets.LMF_PASSERELLE }}
          STATUT: ${{ job.status == 'success' && 'ok' || 'erreur' }}
        run: |
          [ -z "$PASSERELLE" ] && exit 0
          ARGS=(--data-urlencode "statut=$STATUT")
          [ "$STATUT" = "erreur" ] && ARGS+=(--data-urlencode "message=La tâche « ${{ github.workflow }} » a échoué (détail dans GitHub Actions)")
          curl -sSL -G --max-time 30 "$PASSERELLE" "${ARGS[@]}" || true
